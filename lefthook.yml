# lefthook.yml
min_version: 1.5.0

pre-commit:
    parallel: false
    commands:
        biome-check-lint:
            glob: "./src/**/*.{ts}"
            root: "./src/"
            run: npm run lint {staged_files}
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: npx commitlint --edit {1}

pre-push:
    parallel: false
    commands:
        typecheck-bot:
            glob: "./src/**/*.{ts}"
            run: npx tsc --noEmit -p ./tsconfig.json
        build-bot:
            glob: "./src/**/*.{ts}"
            run: rm -rf tgcloud && npm run build